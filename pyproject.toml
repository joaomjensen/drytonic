[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drytonic"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ast-grep-py>=0.35.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tonic = "drytonic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drytonic"]