[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drytonic"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ast-grep-py>=0.35.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tonic = "drytonic.cli:main"
drytonic = "drytonic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drytonic"]
# Rules are added explicitly via force-include below; exclude them from the
# package discovery to avoid adding the same files twice to the wheel.
exclude = ["src/drytonic/rules/**/*"]

[tool.hatch.build.targets.wheel.force-include]
"src/drytonic/rules" = "drytonic/rules"
